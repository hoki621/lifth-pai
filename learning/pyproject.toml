[project]
name = "lifth-pai-learning"
version = "0.0.0"
requires-python = "==3.12.16"
dependencies = [
  "lerobot[pi,training]",
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "roslibpy==2.0.1",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "7e241bd630a3719a56157a497ce5d08f244784f1" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
